
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Ilmiah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="calculator">
            <h1>Kalkulator Ilmiah</h1>
            <p class="mode">DEG | Scientific Calculator</p>

            <input
                type="text"
                id="layar"
                placeholder="0"
                readonly
            >

            <div class="buttons">
                <button class="scientific" data-value="sin(">sin</button>
                <button class="scientific" data-value="cos(">cos</button>
                <button class="scientific" data-value="tan(">tan</button>
                <button class="scientific" data-value="sqrt(">√</button>

                <button class="scientific" data-value="(">(</button>
                <button class="scientific" data-value=")">)</button>
                <button class="danger" data-action="delete">DEL</button>
                <button class="danger" data-action="clear">C</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="/">÷</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="0">0</button>
                <button data-value=".">.</button>
                <button class="equal" data-action="calculate">=</button>
                <button class="operator" data-value="+">+</button>
            </div>
        </div>

        <div class="history">
            <h2>Riwayat Perhitungan</h2>
            <ol id="daftar-riwayat"></ol>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
